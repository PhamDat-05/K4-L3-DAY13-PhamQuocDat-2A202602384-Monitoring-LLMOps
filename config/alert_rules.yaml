alerts:
  - name: HighLatencyP95
    severity: warning
    condition: 'p95(response_sent.latency_ms, 5m) > 2000'
    duration: 5m
    type: symptom-based
    channel: 'slack:#k4-l3b-alerts'
    owner: student-2A202602384
    runbook: docs/alerts.md#alert-1
  - name: HighRequestErrorRate
    severity: critical
    condition: 'count(request_failed, 5m) / count(request_received, 5m) * 100 > 2'
    duration: 5m
    type: symptom-based
    channel: 'slack:#k4-l3b-alerts'
    owner: student-2A202602384
    runbook: docs/alerts.md#alert-2
  - name: LowRetrievalSuccess
    severity: warning
    condition: 'count(tool_name == "retrieval" and tool_success == true, 5m) / count(tool_name == "retrieval" and tool_success != null, 5m) * 100 < 90'
    duration: 5m
    type: symptom-based
    channel: 'slack:#k4-l3b-alerts'
    owner: student-2A202602384
    runbook: docs/alerts.md#alert-3
