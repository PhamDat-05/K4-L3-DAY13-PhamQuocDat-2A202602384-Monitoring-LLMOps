service: day13-l3b-monitoring-llmops-lab
primary_slo:
  name: fast_successful_requests
  window: 28d
  sli:
    good_event: 'event == "response_sent" and latency_ms <= 3000'
    total_event: 'event == "request_received"'
  target_percent: 99.5
  error_budget_percent: 0.5
  note: Một request chỉ đạt khi có response_sent và latency_ms <= 3000. Mục tiêu 99.5% trong 28 ngày cho phép tối đa floor(0.005 * tổng request) request lỗi hoặc chậm; với 10,000 request là 50. Ngưỡng 3000 ms cao hơn P95 baseline thực đo 1271 ms, để dành chỗ cho biến động mạng khi lấy managed prompt từ Langfuse.
guardrails:
  error_rate_pct_max: 2
  daily_cost_usd_max: 2.5
  quality_score_avg_min: 0.75
  retrieval_success_rate_pct_min: 90
